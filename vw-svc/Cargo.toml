[package]
name = "vw-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VW as a service endpoint"
keywords = ["vhdl", "workspace", "dependency-management"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "vw-svc"
path = "src/main.rs"

[dependencies]
vw-lib = { path = "../vw-lib" }
vw-api = { path = "../vw-api" }
vw-api-client = { path = "../vw-api-client" }
vw-api-types-versions = { path = "../vw-api-types/versions" }
camino.workspace = true
dropshot.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
oxide.workspace = true
# The timestamp type the Oxide API reports image creation in.
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
iddqd.workspace = true
bytes = "1"
futures.workspace = true
# `HeaderName` for the API version header dropshot routes on.
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-stream = "0.1"
rust-s3 = { version = "0.37", default-features = false, features = ["with-tokio"] }
tokio-tungstenite.workspace = true
slog = "2.8.2"
slog-error-chain.workspace = true
slog-bunyan = "2.5.0"
slog-async = "2.8.0"
blake3 = "1"
redb = "4.1.0"
reqwest = { version = "0.13", features = ["json"] }
uuid.workspace = true
daft = { version = "0.1.8", features = ["derive"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom"] }

[dev-dependencies]
tempfile.workspace = true
