[package]
name = "vw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A VHDL workspace management tool"
keywords = ["vhdl", "workspace", "dependency-management"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "vw"
path = "src/main.rs"

[dependencies]
vw-lib = { path = "../vw-lib" }
vw-htcl = { path = "../vw-htcl" }
vw-eda = { path = "../vw-eda" }
vw-vivado = { path = "../vw-vivado" }
vw-analyzer = { path = "../vw-analyzer" }
vw-ip = { path = "../vw-ip" }
vw-htcl-cmd = { path = "../vw-htcl-cmd" }
vw-repl = { path = "../vw-repl" }
vw-api-client = { path = "../vw-api-client" }
tokio-tungstenite.workspace = true
reqwest = { version = "0.13", features = ["json"] }
vw-remote = { path = "../vw-remote" }
vw-bench = { path = "../vw-bench" }
vw-sync = { path = "../vw-sync" }
vw-api-types-versions = { path = "../vw-api-types/versions" }
clap.workspace = true
thiserror.workspace = true
slog-error-chain.workspace = true
colored = "2.0"
tokio.workspace = true
camino.workspace = true
dirs.workspace = true
tracing-subscriber.workspace = true
petgraph.workspace = true
futures.workspace = true
glob.workspace = true
indicatif.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
# Demangle Rust (v0/legacy) and C++ symbols in captured crash backtraces so
# `vw bench` failure blocks are readable.
rustc-demangle = "0.1"
cpp_demangle = "0.4"
# `vw run --bunyan-out`: structured bunyan-format log records (RFC3339 timestamps
# via chrono, `hostname` field via gethostname) for the looker CI viewer.
chrono = "0.4"
gethostname = "1.1"
# `vw cloud sync --watch`: filesystem change notification.
notify = "6"

[dev-dependencies]
tempfile.workspace = true
