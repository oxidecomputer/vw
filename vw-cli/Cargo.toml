[package]
name = "vw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A VHDL workspace management tool"
keywords = ["vhdl", "workspace", "dependency-management"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "vw"
path = "src/main.rs"

[dependencies]
vw-lib = { path = "../vw-lib" }
vw-htcl = { path = "../vw-htcl" }
vw-eda = { path = "../vw-eda" }
vw-vivado = { path = "../vw-vivado" }
vw-analyzer = { path = "../vw-analyzer" }
vw-ip = { path = "../vw-ip" }
vw-htcl-cmd = { path = "../vw-htcl-cmd" }
vw-repl = { path = "../vw-repl" }
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
tokio.workspace = true
camino.workspace = true
tracing-subscriber.workspace = true
petgraph.workspace = true
futures.workspace = true
indicatif.workspace = true
serde_json.workspace = true
