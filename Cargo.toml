[workspace]
resolver = "2"
members = [
    "vw-lib",
    "vw-cli",
    "vw-htcl",
    "vw-eda",
    "vw-vivado",
    "vw-analyzer",
    "vw-quote",
    "vw-ip",
    "vw-htcl-cmd",
    "vw-repl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/oxidecomputer/vw"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
dirs = "5.0"
tempfile = "3.0"
regex = "1.0"
camino = "1.1"
netrc = "0.4"
url = "2.5"
glob = "0.3"
petgraph = "0.8.3"
plotters = "0.3"
winnow = "0.6"
async-trait = "0.1"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
portable-pty = "0.9"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm", "ratatui"] }
#ipxact = { path = "/home/ry/src/ipe/crates/ipxact" }
ipxact = { git = "https://github.com/oxidecomputer/ipe", branch = "ry/init" }
