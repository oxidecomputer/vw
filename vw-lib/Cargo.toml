[package]
name = "vw-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for VHDL workspace management"
keywords = ["vhdl", "workspace", "dependency-management"]
categories = ["development-tools"]

[dependencies]
vw-core = { path = "../vw-core" }
anodizer = { git = "https://github.com/oxidecomputer/anodizer" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
thiserror.workspace = true
dirs.workspace = true
tempfile.workspace = true
regex.workspace = true
camino.workspace = true
netrc.workspace = true
url.workspace = true
glob.workspace = true
petgraph.workspace = true
git2 = "0.18"
vhdl_lang.workspace = true
# Used by sim/bridge.rs to codegen the Rust<->VHDL cosim bridge.
quote = "1"
proc-macro2 = "1"
syn = "2"
prettyplease = "0.2"
plotters = { workspace = true, optional = true }

[features]
default = ["plot"]
plot = ["plotters"]
